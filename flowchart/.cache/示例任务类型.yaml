判断是否可准确预测:
  - "是"
  - "否"
  - "部分准确"
  - "无法预测"

首轮可能问题:
  - "您是否了解这个产品？"
  - "您对这个服务有什么疑问？"
  - "您需要什么帮助？"
  - "您之前使用过类似产品吗？"

