constraints:
  骑手状态:
    error_message: 请选择骑手状态
    options:
    - 已接单
    - 已取餐
    - 配送中
    - 已送达
    required: true
  配送方式:
    error_message: 请选择配送方式
    options:
    - 自配送
    - 平台配送
    - 第三方配送
    required: true
  异常情况:
    error_message: 请选择异常情况
    options:
    - 无异常
    - 餐品损坏
    - 配送延迟
    - 地址错误
    - 其他
    required: false